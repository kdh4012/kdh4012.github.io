<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <meta name="description" content="김동현 | Full-Stack Web Developer Portfolio" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // 첫 렌더 전에 테마를 적용해 깜빡임 방지
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t) document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a href="#top" class="nav-logo" id="nav-logo"></a>
      <nav class="nav-links" id="nav-links">
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#experience">Experience</a>
        <a href="#troubleshooting">Troubleshooting</a>
        <a href="#projects">Projects</a>
        <a href="#education">Education</a>
      </nav>
      <button class="theme-btn" id="theme-btn" aria-label="테마 전환">◐</button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-avatar" id="hero-avatar"></div>
      <div class="hero-text">
        <p class="hero-role" id="hero-role"></p>
        <h1 id="hero-name"></h1>
        <p class="hero-tagline" id="hero-tagline"></p>
        <div class="hero-links" id="hero-links"></div>
      </div>
    </section>

    <section class="highlights" id="highlights"></section>

    <section id="about" class="section">
      <h2 class="section-title">About</h2>
      <div id="about-body" class="about"></div>
    </section>

    <section id="skills" class="section">
      <h2 class="section-title">Skills</h2>
      <div id="skills-body" class="skills"></div>
    </section>

    <section id="experience" class="section">
      <h2 class="section-title">Experience</h2>
      <ol id="experience-body" class="timeline"></ol>
    </section>

    <section id="troubleshooting" class="section">
      <h2 class="section-title">Troubleshooting</h2>
      <div id="troubleshooting-body" class="projects"></div>
    </section>

    <section id="projects" class="section">
      <h2 class="section-title">Projects</h2>
      <div id="projects-body" class="projects"></div>
    </section>

    <section id="education" class="section">
      <h2 class="section-title">Education &amp; Certificates</h2>
      <div class="edu-grid">
        <div><h3 class="sub-title">Education</h3><ul id="education-body" class="simple-list"></ul></div>
        <div><h3 class="sub-title">Certificates</h3><ul id="certificates-body" class="simple-list"></ul></div>
      </div>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>

  <!-- 자격증 PDF 다운로드 비밀번호 입력 -->
  <dialog class="cert-dialog" id="cert-dialog">
    <form id="cert-form" method="dialog">
      <h3>자격증 사본 다운로드</h3>
      <p class="muted">비밀번호를 입력하면 다운로드됩니다.</p>
      <input type="password" id="cert-password" autocomplete="off" required aria-label="비밀번호" />
      <p class="cert-msg" id="cert-msg" role="status"></p>
      <div class="cert-actions">
        <button type="submit" value="cancel" formnovalidate class="btn">취소</button>
        <button type="submit" value="ok" class="btn btn-primary">다운로드</button>
      </div>
    </form>
  </dialog>

  <script src="data.js"></script>
  <script src="main.js"></script>
  <!-- 경력기술서 TODO 패널 (제출 전 이 줄과 todo.js 삭제) -->
  <script src="todo.js"></script>
</body>
</html>
