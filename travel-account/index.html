<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>이인극의 통장</title>
<style>
  :root {
    --bg: #ffffff;
    --text-strong: #191f28;
    --text-date: #4e5968;
    --text-sub: #8b95a1;
    --blue: #0d84d4;
    --tag: #1b64da;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    color: var(--text-strong);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: -0.2px;
  }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); }

  /* 상단 헤더: 뒤로가기 + 가운데 제목 */
  .header {
    position: sticky; top: 0; z-index: 10;
    height: 56px; padding-top: env(safe-area-inset-top);
    box-sizing: content-box;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
  }
  .header h1 { font-size: 18px; font-weight: 700; color: #333d4b; }
  .back {
    position: absolute; left: 8px; bottom: 8px;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: 0; cursor: pointer;
  }

  /* 검색/필터 바 (껍데기: 동작 없음) */
  .search-bar {
    margin: 12px 16px 0; padding: 0 16px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    background: #f9fafb; border-radius: 14px;
  }
  .search-bar .filter {
    display: flex; align-items: center; gap: 4px;
    font-size: 13px; color: #4e5968; background: none; border: 0; font-family: inherit; cursor: pointer;
  }
  .list { padding: 38px 20px 96px; }
  .group + .group { margin-top: 32px; }
  .date { font-size: 16px; font-weight: 700; color: var(--text-date); margin-bottom: 12px; }

  .row { display: flex; justify-content: space-between; align-items: flex-start; }
  .row + .row { margin-top: 36px; }
  .left, .right { display: flex; flex-direction: column; gap: 6px; }
  .right { align-items: flex-end; text-align: right; }

  .name   { font-size: 18px; font-weight: 400; color: var(--text-strong); line-height: 24px; }
  .meta   { font-size: 15px; color: var(--text-sub); line-height: 20px; display: flex; gap: 8px; }
  .meta .tag { color: var(--tag); }
  .amount { font-size: 19px; font-weight: 700; line-height: 24px; color: var(--text-strong); }
  .amount.in { color: var(--blue); }
  .balance { font-size: 16px; color: var(--text-sub); line-height: 20px; }

  /* 맨 위로 플로팅 버튼: 일정 이상 스크롤했을 때만 노출 */
  .to-top {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
    display: flex; align-items: center; gap: 6px;
    padding: 12px 18px; border: 0; border-radius: 999px;
    background: #fff; color: #191f28; font: inherit; font-size: 15px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    transition: opacity .2s, transform .2s; cursor: pointer;
  }
  .to-top.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <button class="back" type="button" aria-label="뒤로가기" onclick="history.back()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M21 12H3M11 4l-8 8 8 8" stroke="#191f28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1>이인극의 통장</h1>
  </header>
  <div class="search-bar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-label="검색">
      <circle cx="11" cy="11" r="7" stroke="#191f28" stroke-width="2"/>
      <path d="M16.5 16.5L21 21" stroke="#191f28" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <button class="filter" type="button">
      3개월 · 전체 · 최신순
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
        <path d="M6 9l6 6 6-6" stroke="#4e5968" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <main class="list" id="list"></main>
  <button class="to-top" id="toTop" type="button">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M12 21V3M4 11l8-8 8 8" stroke="#191f28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    맨 위로

</div>
